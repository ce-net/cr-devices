[package]
name = "cr-devices"
version = "0.2.0"
description = "The cr.devices cell: every device of the mesh for the control room, online or not; majors 2 and 1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cr-devices"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
cr-devices-api = { path = "../cr-devices-api" }
ui-part = { workspace = true }
ui-chain = { workspace = true }
cr-sources = { workspace = true }
ce-wire = { workspace = true, features = ["server", "client"] }
ce-gate = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
serde_json = "1"
